name: Publish to npm

# Push a version tag (`npm version patch && git push --follow-tags`) to publish that version.
# Authenticates with npm trusted publishing (OIDC): no npm token is stored in the repo.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm verify this workflow and sign a provenance statement

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24 # ships npm 11, which supports trusted publishing
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no caches in release builds
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs the tests and prepack runs the build.
      - run: npm publish

  # A separate job so a failed release can be re-run without publishing to npm again.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --notes "$(cat <<EOF
          Published to npm: [icy-tower-reloaded@$version](https://www.npmjs.com/package/icy-tower-reloaded/v/$version)

          \`\`\`bash
          npx icy-tower-reloaded@$version
          \`\`\`
          EOF
          )"
